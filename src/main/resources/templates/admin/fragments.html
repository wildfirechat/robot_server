<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 智能助手管理后台'">智能助手管理后台</title>
    <link rel="stylesheet" th:href="@{/admin.css}">
</head>
<body>
<aside th:fragment="sidebar(active)" class="sidebar">
    <a class="brand" th:href="@{/admin}">智能助手管理后台</a>
    <nav class="sidebar-nav">
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'">概览</a>
        <a th:href="@{/admin/knowledge}" th:classappend="${active == 'knowledge'} ? 'active'">知识库</a>
        <a th:href="@{/admin/messages}" th:classappend="${active == 'messages'} ? 'active'">消息</a>
        <a th:href="@{/admin/config}" th:classappend="${active == 'config'} ? 'active'">配置管理</a>
        <a th:href="@{/admin/password}" th:classappend="${active == 'password'} ? 'active'">修改密码</a>
        <form th:action="@{/admin/logout}" method="post" class="sidebar-logout">
            <button type="submit" class="link-button">退出登录</button>
        </form>
    </nav>
</aside>
</body>
</html>
