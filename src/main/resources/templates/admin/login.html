<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('登录')}"></head>
<body class="login-page">
<main class="login-box">
    <h1>机器人管理后台</h1>
    <p class="subtle">请输入管理员账号密码</p>

    <div class="alert error" th:if="${param.error}">用户名或密码错误</div>
    <div class="alert error" th:if="${param.locked}">尝试次数过多，请 10 分钟后再试</div>
    <div class="alert error" th:if="${param.expired}">该账号已在其他地方登录，当前会话已失效，请重新登录</div>
    <div class="alert ok" th:if="${param.logout}">已退出登录</div>
    <div class="alert ok" th:if="${param.changed}">密码已修改，请使用新密码登录</div>

    <form th:action="@{/admin/login}" method="post" class="form">
        <label>用户名
            <input type="text" name="username" autocomplete="username" maxlength="64" required autofocus>
        </label>
        <label>密码
            <input type="password" name="password" autocomplete="current-password" maxlength="72" required>
        </label>
        <button type="submit" class="primary block">登录</button>
    </form>

    <p class="hint">
        首次启动的初始密码见服务启动日志；也可以在启动服务时通过环境变量
        <code>ROBOT_ADMIN_PASSWORD</code> 指定（至少 10 位且包含字母和数字）。
    </p>
</main>
</body>
</html>
