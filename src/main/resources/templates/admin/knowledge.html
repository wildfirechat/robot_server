<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('知识库')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav}"></header>
<main class="container">
    <h1>知识库</h1>
    <p class="subtle">上传或粘贴资料后，机器人会先检索资料再回答，并在回答中标注引用编号。当前分块数：<strong th:text="${chunkCount}">0</strong></p>

    <div class="alert ok" th:if="${message}" th:text="${message}">操作成功</div>
    <div class="alert error" th:if="${error}" th:text="${error}">操作失败</div>
    <div class="alert warn" th:if="${!ragEnabled}">
        知识库检索未启用，请先到<a th:href="@{/admin/config}">配置管理</a>开启 RAG 并配置 Embedding 模型。
    </div>

    <div class="grid-2">
        <section class="panel">
            <h2>上传文件</h2>
            <form th:action="@{/admin/knowledge/upload}" method="post" enctype="multipart/form-data" class="form">
                <label>标题
                    <input type="text" name="title" maxlength="255" placeholder="留空使用文件名">
                </label>
                <label>文件
                    <input type="file" name="file" accept=".txt,.md,.markdown,.csv,.json,.pdf,.docx" required>
                    <span class="help">支持 txt/md/csv/json/pdf/docx，单文件不超过 10MB</span>
                </label>
                <button type="submit" class="primary">上传并处理</button>
            </form>
        </section>

        <section class="panel">
            <h2>粘贴文本</h2>
            <form th:action="@{/admin/knowledge/text}" method="post" class="form">
                <label>标题
                    <input type="text" name="title" maxlength="255" placeholder="例如：产品手册">
                </label>
                <label>内容
                    <textarea name="content" rows="7" maxlength="2000000" required></textarea>
                </label>
                <button type="submit" class="primary">提交并处理</button>
            </form>
        </section>
    </div>

    <section class="panel">
        <div class="section-head">
            <h2>文档列表</h2>
            <form th:action="@{/admin/knowledge/reindex}" method="post" class="inline-form">
                <button type="submit" class="link-button">重新加载索引</button>
            </form>
        </div>
        <table class="table">
            <thead>
            <tr><th>ID</th><th>标题</th><th>类型</th><th>状态</th><th>分块数</th><th>更新时间</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="doc : ${documents}">
                <td th:text="${doc.id}">1</td>
                <td th:text="${doc.title}">文档</td>
                <td th:text="${doc.sourceType}">text</td>
                <td>
                    <span class="tag" th:text="${doc.status}">READY</span>
                    <div class="error-text" th:if="${doc.errorMessage}" th:text="${doc.errorMessage}"></div>
                </td>
                <td th:text="${doc.chunkCount}">0</td>
                <td class="nowrap" th:text="${doc.updatedTimeText}">2026-01-01 12:00</td>
                <td>
                    <form th:action="@{/admin/knowledge/{id}/delete(id=${doc.id})}" method="post" class="inline-form">
                        <button type="submit" class="link-button danger">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(documents)}">
                <td colspan="7" class="empty">还没有知识库文档</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="panel">
        <h2>检索测试</h2>
        <form th:action="@{/admin/knowledge/test}" method="post" class="form">
            <label>问题
                <input type="text" name="query" th:value="${testQuery}" maxlength="1000" placeholder="输入问题，查看召回的片段" required>
            </label>
            <button type="submit" class="primary">测试检索</button>
        </form>

        <div th:if="${testQuery != null and !testQuery.isEmpty()}">
            <h3>召回结果</h3>
            <table class="table" th:if="${testResult != null and !#lists.isEmpty(testResult.hits)}">
                <thead>
                <tr><th>#</th><th>标题</th><th>相似度</th><th>内容</th></tr>
                </thead>
                <tbody>
                <tr th:each="hit, stat : ${testResult.hits}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${hit.title}">标题</td>
                    <td th:text="${#numbers.formatDecimal(hit.score, 1, 3)}">0.000</td>
                    <td th:text="${hit.content}">片段内容</td>
                </tr>
                </tbody>
            </table>
            <p class="empty" th:if="${testResult != null and #lists.isEmpty(testResult.hits)}">没有召回结果</p>
        </div>
    </section>
</main>
</body>
</html>
