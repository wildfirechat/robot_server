<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('修改密码')}"></head>
<body>
<div class="layout">
<aside th:replace="~{admin/fragments :: sidebar('password')}"></aside>
<main class="container narrow">
    <h1>修改密码</h1>
    <form th:action="@{/admin/password}" th:object="${form}" method="post" class="form panel">
        <div class="alert warn" th:if="${param.force}">首次登录使用的是系统生成的初始密码，必须修改密码后才能继续使用管理后台。</div>
        <div class="alert error" th:if="${error}" th:text="${error}">修改失败</div>

        <label>当前密码
            <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
        </label>
        <label>新密码
            <input type="password" th:field="*{newPassword}" autocomplete="new-password"
                   minlength="10" maxlength="72" required>
            <span class="help">至少 10 位，且同时包含字母和数字</span>
        </label>
        <label>确认新密码
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                   minlength="10" maxlength="72" required>
        </label>

        <div class="form-actions">
            <button type="submit" class="primary">修改密码</button>
            <a class="button-link" th:href="@{/admin}">返回概览</a>
        </div>
    </form>
</main>
</div>
</body>
</html>
