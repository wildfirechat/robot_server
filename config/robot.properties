# 机器人ID
robot.im_id=FireRobot
# 机器人名称。在群里@机器人时，处理消息内容需要去掉机器人的名字。
robot.im_name=小火
# 注意端口是80端口，不是admin的18080端口
robot.im_url=http://localhost
# 注意secret是机器人的secret，不是admin的secret
robot.im_secret=123456

# 当前服务的公网地址，用来生成webhook地址。
robot.public_addr=http://192.168.3.101:8883

# ==================== OpenAI 兼容的大模型配置 ====================
# 是否启用大模型自动回复。为 false 时机器人只会回复未开启的提示。
robot.llm.enabled=true

# 大模型接口地址，一般写到 /v1 结尾即可，程序会自动拼接 /chat/completions。
# 也可以直接写完整的 .../chat/completions 地址。
# 默认使用 DeepSeek: https://api.deepseek.com
# OpenAI:      https://api.openai.com/v1
# 通义千问:    https://dashscope.aliyuncs.com/compatible-mode/v1
# 本地 vLLM:   http://127.0.0.1:8000/v1
# 本地 Ollama: http://127.0.0.1:11434/v1
robot.llm.base_url=https://api.deepseek.com

# API Key。本地部署的 vLLM/Ollama 等不需要鉴权时可以留空。
robot.llm.api_key=sk-aaaaaaaaaa

# 模型名称，DeepSeek 可用 deepseek-chat（默认）或 deepseek-reasoner
robot.llm.model=deepseek-chat

# 系统提示词，可以按业务修改机器人的角色设定
robot.llm.system_prompt=你是一个智能助手，请使用简洁的中文回答用户的问题。

# 温度，取值 0~2，越大回答越发散
robot.llm.temperature=0.7

# 单次回复的最大 token 数，<=0 表示不传该参数
robot.llm.max_tokens=2048

# 请求超时时间（秒）
robot.llm.timeout_seconds=120

# 每次请求携带的历史消息条数（包含当前用户消息），默认 30 条
robot.llm.history_limit=30

# 是否使用流式接口。true 时边生成边回复，false 时生成完再一次性推送
robot.llm.stream=true

# 流式回复时两次推送消息的最小间隔（毫秒），避免消息条数过多。
# 小于等于 0 时使用默认值 500 毫秒。
robot.llm.stream_interval_ms=500
