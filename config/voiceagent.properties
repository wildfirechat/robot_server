# ============ 野火语音 Agent 配置 ============
# 关掉则退回原来的 EchoAudioDevice（延迟 3 秒复读），用来对照排查通话链路
agent.enabled=true

# 来电后多久接听（毫秒）
agent.answer-delay-ms=800

# ---- ASR：wf-voice 实时识别（WebSocket，默认 12436 端口）----
# 启动：./wf-voice -m ./model/wf-voice-small.gguf -p 4
agent.asr-url=ws://127.0.0.1:12436
# 攒够多少毫秒音频发一帧。太碎小包多，太久拖慢断句
agent.asr-batch-ms=60

# ---- LLM：任何 OpenAI 格式的 /v1/chat/completions ----
# 本机 Ollama / vLLM / 客户内网自建 / 云端 API，改地址即可
agent.llm-url=http://127.0.0.1:11434/v1/chat/completions
agent.llm-key=
agent.llm-model=qwen2.5:1.5b
agent.llm-temperature=0.6
agent.llm-max-history-turns=12
# 单次回复的 token 上限：语音回答应该短，硬上限防偶发长篇大论。<=0 表示不限
agent.llm-max-tokens=200
# 软标点断句的最小字数
agent.llm-min-sentence-chars=8
# 一直没标点时的强制断句字数
agent.llm-max-sentence-chars=60

# ---- TTS：wf-tts 语音合成 ----
# 流式合成（WebSocket）：边合成边推 PCM，首声快，失败时自动回退下面的 HTTP 整句合成
agent.tts-stream=true
agent.tts-ws-url=ws://127.0.0.1:12438
# HTTP 整句合成接口（wf-tts 的 OpenAI 兼容端点），同时作为流式的兜底
agent.tts-url=http://127.0.0.1:12437/v1/audio/speech
agent.tts-key=
# 合成模型和音色。换发音人改这里就行，不用动下面的模板
agent.tts-model=tts-1
agent.tts-voice=keqing
# 请求体模板：{text} 换成要合成的文本，{model}/{voice} 换成上面两项。
# 接口不是 OpenAI 格式的（GPT-SoVITS、CosyVoice、商业 TTS）改这一行适配，
# 音色字段各家叫法不同，把 {voice} 放到它自己的字段名下面即可，例如：
# agent.tts-body-template={"text":"{text}","speaker":"{voice}","format":"wav"}
agent.tts-body-template={"model":"{model}","voice":"{voice}","response_format":"wav","speed":1.0,"input":"{text}"}
agent.tts-format=wav
agent.tts-raw-sample-rate=24000

# ---- 打断 ----
agent.barge-in-enabled=true
# 帧能量 RMS 阈值（0~32768），客户端有回声消除，可以给低一点
agent.barge-in-rms-threshold=900
# 连续多少帧（每帧 10ms）超阈值才算真开口
agent.barge-in-frames=6

# ---- 对话节奏 ----
# ASR 出一段后再等这么久没有新段，才认为这句话说完了
agent.utterance-gap-ms=400
agent.greeting=你好，我是野火语音助手，有什么可以帮你的？
# 播放队列最多缓存多少秒 AI 语音。TTS 比实时快，长回答会在队列里堆着，
# 缓存不够就得丢正在播的句子，听起来就是无缘无故少了几个字。调小只会更容易丢音
agent.playback-max-seconds=60

# ---- 留痕 ----
# 把通话文字记录发回 IM 会话，可回看，也是天然的审计留痕
agent.transcript-to-im=true
